[package]
name = "optimizer-by-raghav"
version = "2.2.0"
edition = "2021"
authors = ["Raghav Goyal"]
description = "Native Windows System Identifier & Performance Optimizer"
default-run = "OptimizerByRaghav"

[[bin]]
name = "OptimizerByRaghav"
path = "src/main.rs"

[[bin]]
name = "OptimizerByRaghav-Setup"
path = "src/bin/setup.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.10"
sysinfo = "0.33"
winreg = "0.55"
wmi = "0.14"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Power",
    "Win32_System_Services",
    "Win32_Security",
    "Win32_Media",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_Registry",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
